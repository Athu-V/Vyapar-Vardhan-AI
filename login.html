<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login</title>
    <style>
      body { font-family: system-ui, -apple-system, Arial; display:flex; align-items:center; justify-content:center; height:100vh; }
      .card { border:1px solid #ddd; padding:24px; border-radius:8px; width:320px }
      input { width:100%; padding:8px; margin:8px 0 }
      button { width:100%; padding:10px }
    </style>
  </head>
  <body>
    <div class="card">
      <h3>Sign in</h3>
      <label>
        Username
        <input id="username" autocomplete="username" />
      </label>
      <label>
        Password
        <input id="password" type="password" autocomplete="current-password" />
      </label>
      <button id="login">Sign in</button>
      <p id="message" style="color:crimson"></p>
    </div>

    <script>
      document.getElementById('login').addEventListener('click', async () => {
        const username = document.getElementById('username').value || 'user'
        const password = document.getElementById('password').value || ''
        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password }),
          })
          if (!res.ok) {
            const j = await res.json().catch(() => ({}))
            document.getElementById('message').textContent = j.error || 'Login failed'
            return
          }
          // On success, go to the chat UI
          window.location.href = '/'
        } catch (err) {
          document.getElementById('message').textContent = 'Network error'
        }
      })
    </script>
  </body>
</html>
